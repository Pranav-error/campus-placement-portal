databases:
  - name: placement-db
    plan: free
    databaseName: placement_portal
    user: placement_app

services:
  - type: web
    name: campus-placement-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DB_HOST
        fromDatabase: { name: placement-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: placement-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: placement-db, property: database }
      - key: DATABASE_USERNAME
        fromDatabase: { name: placement-db, property: user }
      - key: DATABASE_PASSWORD
        fromDatabase: { name: placement-db, property: password }
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: ""
        # set to the frontend's https://*.onrender.com URL once it's known —
        # render.yaml has no way to reference another service's URL with scheme.

  # campus-placement-frontend is added once the backend's URL is known (its
  # build bakes in the API base URL at build time) — see README.
