<section class="form-page">
  <h1>{{ jobId ? 'Edit Job' : 'Post Job' }}</h1>

  @if (error()) {
    <div class="banner banner-error">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="field">
      <label for="companyId">Company *</label>
      <select id="companyId" formControlName="companyId" [class.invalid]="isInvalid('companyId')">
        <option [ngValue]="null">Select a company</option>
        @for (c of companies(); track c.id) {
          <option [ngValue]="c.id">{{ c.name }}</option>
        }
      </select>
      @if (isInvalid('companyId')) {
        <span class="field-error">Company is required.</span>
      }
    </div>

    <div class="field">
      <label for="title">Job Title *</label>
      <input id="title" type="text" formControlName="title" [class.invalid]="isInvalid('title')" />
      @if (isInvalid('title')) {
        <span class="field-error">Title is required.</span>
      }
    </div>

    <div class="field-row">
      <div class="field">
        <label for="location">Location</label>
        <input id="location" type="text" formControlName="location" />
      </div>
      <div class="field">
        <label for="ctcLpa">CTC (LPA)</label>
        <input id="ctcLpa" type="number" step="0.1" formControlName="ctcLpa" />
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="openings">Openings</label>
        <input id="openings" type="number" min="1" formControlName="openings" />
      </div>
      <div class="field">
        <label for="applicationDeadline">Application Deadline</label>
        <input id="applicationDeadline" type="date" formControlName="applicationDeadline" />
      </div>
    </div>

    <div class="field">
      <label for="description">Description</label>
      <textarea id="description" formControlName="description"></textarea>
    </div>

    <h2 class="section-title">Eligibility Criteria</h2>

    <div class="field-row">
      <div class="field">
        <label for="minCgpa">Minimum CGPA</label>
        <input id="minCgpa" type="number" step="0.01" min="0" max="10" formControlName="minCgpa" [class.invalid]="isInvalid('minCgpa')" />
      </div>
      <div class="field">
        <label for="maxBacklogs">Max Backlogs Allowed</label>
        <input id="maxBacklogs" type="number" min="0" formControlName="maxBacklogs" [class.invalid]="isInvalid('maxBacklogs')" />
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="eligibleBranches">Eligible Branches (comma-separated)</label>
        <input id="eligibleBranches" type="text" formControlName="eligibleBranches" placeholder="CSE, ISE, ECE" />
      </div>
      <div class="field">
        <label for="eligibleGraduationYear">Graduation Year</label>
        <input id="eligibleGraduationYear" type="number" formControlName="eligibleGraduationYear" />
      </div>
    </div>

    <div class="field">
      <label for="requiredSkills">Required Skills (comma-separated)</label>
      <input id="requiredSkills" type="text" formControlName="requiredSkills" placeholder="Java, React, SQL" />
    </div>

    <div class="form-actions">
      <button type="submit" [disabled]="saving()">{{ saving() ? 'Saving...' : 'Save' }}</button>
      <a routerLink="/jobs">Cancel</a>
    </div>
  </form>
</section>
