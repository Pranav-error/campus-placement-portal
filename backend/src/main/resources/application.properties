spring.application.name=campus-placement-portal

# --- Postgres ---
# Local/dev default targets a Postgres on localhost with DB_USERNAME/DB_PASSWORD env vars.
# In production (Render), set DATABASE_URL to a full JDBC URL instead, e.g.:
#   jdbc:postgresql://<HOST>:<PORT>/<DATABASE>
# and DATABASE_USERNAME/DATABASE_PASSWORD to the Postgres instance's credentials.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/placement_portal}
spring.datasource.username=${DATABASE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${DATABASE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Server ---
server.port=${PORT:8080}

# --- File upload (CSV bulk student import) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- JWT ---
app.jwt.secret=${JWT_SECRET:change-this-secret-in-env}
app.jwt.expiration-ms=86400000

# --- CORS ---
# Comma-separated list of extra allowed frontend origins in production (e.g. the deployed
# frontend's Railway URL). Read by SecurityConfig alongside the hardcoded dev/Vercel patterns.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
