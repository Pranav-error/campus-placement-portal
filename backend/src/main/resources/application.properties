spring.application.name=campus-placement-portal

# --- MySQL ---
# Local/dev default targets a MySQL on localhost with DB_USERNAME/DB_PASSWORD env vars.
# In production (Railway), set DATABASE_URL to a full JDBC URL instead, e.g.:
#   jdbc:mysql://<MYSQLHOST>:<MYSQLPORT>/<MYSQLDATABASE>?useSSL=false&serverTimezone=UTC
# and DATABASE_USERNAME/DATABASE_PASSWORD to the MySQL service's credentials.
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/placement_portal?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${DATABASE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Server ---
server.port=${PORT:8080}

# --- JWT ---
app.jwt.secret=${JWT_SECRET:change-this-secret-in-env}
app.jwt.expiration-ms=86400000

# --- CORS ---
# Comma-separated list of extra allowed frontend origins in production (e.g. the deployed
# frontend's Railway URL). Read by SecurityConfig alongside the hardcoded dev/Vercel patterns.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
